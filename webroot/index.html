<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AW8697 振动增强</title>
<style>
  :root {
    --bg: #121212; --card: #1e1e1e; --fg: #e8e8e8; --dim: #9a9a9a;
    --accent: #4a9eff; --ok: #4caf50; --err: #f44336; --border: #2e2e2e;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f5f7; --card:#fff; --fg:#1a1a1a; --dim:#6b6b6b; --border:#e0e0e0; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Noto Sans CJK SC", sans-serif;
    font-size: 14px; line-height: 1.6;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 18px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; margin-bottom: 12px;
  }
  .row { display: flex; gap: 8px; }
  button {
    flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--fg); font-size: 14px;
    font-family: inherit; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:active { opacity: .7; }
  button:disabled { opacity: .4; }
  .params { display: flex; gap: 10px; margin-top: 12px; }
  .params label { flex: 1; font-size: 12px; color: var(--dim); }
  .params input {
    width: 100%; margin-top: 4px; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--fg);
    font-size: 14px; font-family: inherit;
  }
  #output {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; font-family: ui-monospace, monospace; font-size: 11.5px;
    line-height: 1.5; white-space: pre-wrap; word-break: break-all;
    min-height: 120px; color: var(--dim); overflow-x: auto;
  }
  #output .ok { color: var(--ok); }
  #output .err { color: var(--err); }
  .hint { font-size: 12px; color: var(--dim); margin-top: 10px; line-height: 1.7; }
</style>
</head>
<body>

<h1>AW8697 振动增强</h1>
<div class="sub">realme Neo8 / RMX8899</div>

<div class="card">
  <div class="row">
    <button class="primary" id="btnCheck">检查状态</button>
    <button id="btnBuild">生成波形</button>
  </div>
  <div class="params">
    <label>RAM 波形增益
      <input id="ramGain" value="1.85" inputmode="decimal">
    </label>
    <label>stepable 增益
      <input id="stepGain" value="11.0" inputmode="decimal">
    </label>
  </div>
</div>

<div id="output">点上面的按钮开始。</div>

<div class="hint">
  检查：读取内核日志里驱动实际加载的校验和，和模块文件比对。<br>
  生成：读取本机原厂固件，按增益放大后输出到 /sdcard/vib_boost。<br>
  生成后需覆盖进模块目录并重启才生效。
</div>

<script>
const MOD = '/data/adb/modules/vib_wave_boost';
const out = document.getElementById('output');

function setOut(text, isErr) {
  out.textContent = text || '(无输出)';
  out.style.color = isErr ? 'var(--err)' : 'var(--dim)';
}

function run(cmd, label) {
  const b1 = document.getElementById('btnCheck');
  const b2 = document.getElementById('btnBuild');
  b1.disabled = b2.disabled = true;
  setOut(label + ' 执行中，请稍候…');
  // ksu.exec 是同步调用，执行期间页面会卡住，属正常现象
  setTimeout(() => {
    try {
      const r = ksu.exec(cmd);
      setOut(r || '(无输出)');
    } catch (e) {
      setOut('执行失败：' + e, true);
    } finally {
      b1.disabled = b2.disabled = false;
    }
  }, 50);
}

document.getElementById('btnCheck').onclick = () => {
  run('sh ' + MOD + '/verify.sh 2>&1', '检查');
};

document.getElementById('btnBuild').onclick = () => {
  const rg = document.getElementById('ramGain').value.trim();
  const sg = document.getElementById('stepGain').value.trim();
  const cmd = 'RAM_GAIN=' + rg + ' STEP_GAIN=' + sg + ' sh ' + MOD + '/gen.sh 2>&1';
  run(cmd, '生成');
};
</script>

</body>
</html>
